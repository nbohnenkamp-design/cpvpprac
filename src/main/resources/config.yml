reset:
  enabled: true
  time: "04:00"
  fallback-world: "world"
  delay-between-worlds-seconds: 5
  backup:
    enabled: false
    directory: "world-backups"
  warnings:
    - minutes: 10
      message: "§e[CPVPSingleBiome] §fArena reset in §e10 minutes§f!"
    - minutes: 5
      message: "§6[CPVPSingleBiome] §fArena reset in §65 minutes§f!"
    - minutes: 1
      message: "§c[CPVPSingleBiome] §fArena reset in §c1 minute§f!"

chunky:
  enabled: true
  radius: 500
  shape: "circle"
  timeout-minutes: 30

maintenance:
  enabled: true
  kick-message: "§c[CPVPSingleBiome] §fServer is resetting arenas. Please reconnect shortly."
  broadcast-on: "§c[CPVPSingleBiome] §fMaintenance started — arenas are resetting."
  broadcast-off: "§a[CPVPSingleBiome] §fArenas reset complete. Maintenance ended."
