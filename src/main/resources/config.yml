# CPVPPracticeBot Configuration

bot:
  # Display name of the bot (supports & color codes)
  name: "&5Practice Bot"

  # Entity type — only HUSK is supported in this version; Husks are daylight-immune
  entity-type: HUSK

  armor:
    # NONE, DIAMOND, or NETHERITE
    type: DIAMOND
    # NONE, PROTECTION_4, or BLAST_PROTECTION_4
    enchantment: PROTECTION_4

  # Restore full health after every hit so the bot never dies
  unlimited-health: true

  # Cancel all incoming velocity (knockback / explosion push) for the bot
  anti-knockback: true

  follow:
    # Whether follow mode is active when the bot first spawns
    enabled-by-default: true
    # Bot starts moving when further than this many blocks from its owner
    distance: 3.0
    # Movement speed in blocks per tick (default player walk speed is 0.21)
    movement-speed: 0.35

  attack:
    # Whether attack mode is active when the bot first spawns
    enabled-by-default: false
    # Maximum distance in blocks at which the bot will hit its owner
    reach: 3.0
    # Attacks per second (1.0 = one hit every second)
    speed: 1.0

  shield:
    # Give the bot a shield in its off-hand
    # Note: actual blocking behaviour requires NMS and is not implemented yet
    enabled: false

messages:
  prefix: "&5[PracticeBot]&r "
