# -----------------------------------------------------------------------------
# Automatic world reset
# -----------------------------------------------------------------------------
# Only listed worlds are touched.
# last-reset-date is used to calculate the next automatic full reset.
# It is auto-written after /cpvpsb reset now or after a scheduled full reset.
# Single-world resets like /cpvpsb reset snow do not change last-reset-date.
#
# Automatic scheduled resets are disabled by default for safety.
# Set enabled to true only after you have configured the worlds below.
# When enabled is set to true for the first time and last-reset-date is empty,
# the plugin stores the current date as the scheduler start date and does not
# run an immediate reset.

# CPVPSingleBiome Configuration
# Supported biomes:
# desert, plains, badlands, snow, mushroom, end

default-biome: plains                    # used when /cpvpsb create is called without a biome argument

# -----------------------------------------------------------------------------
# Terrain generation
# -----------------------------------------------------------------------------

base-height: 70                          # average terrain height

height-variation: 10                     # terrain height variation; lower = flatter, higher = stronger hills

noise-scale: 80.0                        # terrain noise scale; lower = more frequent bumps, higher = wider terrain waves

flatness: 0.35                           # terrain smoothing; 0.0 = full hills, 1.0 = very flat

# -----------------------------------------------------------------------------
# Decorations
# -----------------------------------------------------------------------------
# Decoration defaults are kept sparse to preserve PvP readability and open sightlines.

decoration:

  enabled: true                          # master switch for terrain decorations

  density: 0.15                          # global decoration density; lower = cleaner PvP terrain, higher = more visual detail

  tree-density: 0.4                      # global tree density; lower = open sightlines, higher = more trees

  small-trees: true                      # enables small biome-specific trees or bushes where supported

  flowers: true                          # enables small plains-style grass and flower details

  rocks: true                            # enables small biome-specific rock and terrain details

  dead-bushes: true                      # enables dry decoration details in desert-style biomes

  cactus: true                           # enables cactus generation in desert-style terrain

  mushrooms: true                        # enables small and large mushroom decoration in mushroom terrain

  # ---------------------------------------------------------------------------
  # Biome-specific overrides
  # ---------------------------------------------------------------------------

  biomes:

    plains:
      density: 0.12                      # biome decoration density; PvP-friendly range: 0.05-0.20, higher = more clutter
      tree-density: 0.20                 # biome tree density; lower = more open sightlines, higher = more trees

    desert:
      density: 0.08                      # biome decoration density; low values keep desert terrain open
      tree-density: 0.0                  # biome tree density; 0.0 = no trees

    badlands:
      density: 0.18                      # biome decoration density; higher values add more formations/details
      tree-density: 0.0                  # biome tree density; 0.0 = no trees

    snow:
      density: 0.14                      # biome decoration density; lower values keep snowy terrain readable
      tree-density: 0.35                 # biome tree density; lower values keep snow worlds more open

    mushroom:
      density: 0.22                      # biome decoration density; higher values add more mushroom details
      tree-density: 0.0                  # biome tree density; 0.0 = no trees

    end:
      density: 0.04                      # biome decoration density; very low values keep End-style terrain open
      tree-density: 0.0                  # biome tree density; 0.0 = no trees

# -----------------------------------------------------------------------------
# Snow biome atmosphere
# -----------------------------------------------------------------------------
# Snow settings are designed to keep the biome readable for PvP while adding atmosphere:
# light snow ambience, thin snow layers, larger but controlled packed-ice areas,
# sparse rock details and very few small/medium spruce trees.
#
# No powder snow.
# No ice-spike fields.
# No dense structures.
# No mixed blue-ice color noise.
#
# Generated ice areas use PACKED_ICE only:
# - looks like real frozen ice
# - slightly slippery
# - visually calmer than mixed ICE / PACKED_ICE / BLUE_ICE
# - no dark blue-ice spots

snow-effects:

  snowflake-particles:
    enabled: true                        # enables light ambient snow particles in snow worlds
    interval-ticks: 20                   # 20 ticks = once per second
    particles-per-player: 5              # particles per player; lower = cleaner view, higher = stronger ambience
    radius: 10                           # horizontal particle spread around players
    height: 4                            # vertical particle spread above players

  terrain:
    snow-layers: true                    # enables thin snow layers on suitable ground
    snow-layer-chance: 0.55              # snow layer chance; 0.0 = none, 1.0 = many surfaces covered
    max-snow-layer-height: 1             # maximum snow layer height; 1 keeps terrain easiest to read

  ice-details:
    enabled: true                        # enables small packed-ice accents and rare frozen ponds
    pond-chance: 0.02                    # frozen pond chance; higher = more ponds
    small-ice-patch-chance: 0.005         # small packed-ice patch chance; higher = more local ice details
    max-pond-radius: 5                   # maximum frozen pond radius; higher = larger ice areas
    max-ice-patch-radius: 3              # maximum small ice patch radius

  rocks:
    enabled: true                        # enables small stone or ice rock details
    chance: 0.01                         # rock chance; lower = cleaner terrain, higher = more details
    max-size: 2                          # maximum rock size; lower values keep terrain less obstructed

  trees:
    enabled: true                        # enables rare small or medium snow spruce trees
    chance: 0.05                         # tree chance per chunk; lower = more open sightlines

# -----------------------------------------------------------------------------
# World settings
# -----------------------------------------------------------------------------
# Minecraft worldborder size is a diameter, not a radius.
# 10000 means roughly X/Z -5000 to +5000 around the border center.


# -----------------------------------------------------------------------------
# Automatic world reset
# -----------------------------------------------------------------------------
# Only listed worlds are touched.
# last-reset-date is used to calculate the next automatic full reset.
# It is auto-written after /cpvpsb reset now or after a scheduled full reset.
# Single-world resets like /cpvpsb reset snow do not change last-reset-date.

# Automatic scheduled resets are disabled by default for safety.
# Set enabled to true only after you have configured the worlds below.
# When enabled is set to true for the first time and last-reset-date is empty,
# the plugin stores the current date as the scheduler start date and does not
# run an immediate reset.

reset:

  enabled: false                         # false = safe default; set true to enable scheduled automatic resets

  time: "05:00"                          # scheduled reset time in HH:mm format, interpreted in reset.timezone

  timezone: ""                           # empty = use server/JVM timezone; set Europe/Berlin for German time incl. automatic summer/winter time; examples: UTC, America/New_York, Asia/Tokyo

  interval-days: 5                       # days between scheduled full resets; 1 = daily, 7 = weekly

  last-reset-date: ""                    # internal scheduler date in YYYY-MM-DD format; leave empty on fresh installs

  world-settings:
    difficulty: HARD                     # PEACEFUL / EASY / NORMAL / HARD
    gamemode: SURVIVAL                   # SURVIVAL / CREATIVE / ADVENTURE / SPECTATOR
    pvp: true                            # true = PvP enabled after reset

  fallback-world: "world"                # must be an existing safe world; players are moved there before reset

  skip-if-any-player-online: false       # false = scheduled reset may run even if players are online

  retry-after-minutes: 10                # minutes before checking again after a postponed scheduled reset

  block-joins-during-reset: true         # true = block normal players during world delete/create phase

  block-joins-during-chunky: false       # false = normal players may join while Chunky is running

  maintenance-bypass-permission: "cpvpsinglebiome.maintenance.bypass"

  maintenance-kick-message: "§c[CPVPSingleBiome] §fArenas are resetting. Please reconnect shortly."

  warning-enabled: true                  # true = broadcast countdown warnings before a scheduled reset

  warning-minutes: [10, 5, 1]            # minutes before reset when warnings are sent

  backup-old-worlds: false               # true = move old world folders to backup instead of deleting directly

  delete-old-worlds-after-success: true  # only relevant if backup-old-worlds is true

  maintenance-during-reset: false        # true = run configured console commands before and after reset

  maintenance-command-on: "say Arena reset maintenance started"   # console command before reset, only used if maintenance-during-reset is true

  maintenance-command-off: "say Arena reset maintenance finished" # console command after reset, only used if maintenance-during-reset is true

  # world = world name, biome = CPVPSingleBiome biome type.
  # These entries are examples; keep them in sync with the worlds you actually create.
  worlds:
    - { world: "plains",   biome: "plains" }
    - { world: "desert",   biome: "desert" }
    - { world: "badlands", biome: "badlands" }
    - { world: "snow",     biome: "snow" }
    - { world: "mushroom", biome: "mushroom" }
    - { world: "end",      biome: "end" }

# -----------------------------------------------------------------------------
# Chunky integration
# -----------------------------------------------------------------------------
world-border-size: 2000                # 0 = disabled | should be 2x chunky.radius

chunky:

  enabled: false                         # false = safe default; set true to run Chunky automatically after resets

  radius: 1000                           # pregeneration radius in blocks

  shape: "circle"                        # pregeneration shape: circle or square

  center-spawn: true                     # true = center on world spawn, false = center on 0/0

  silent: false                          # true = suppress Chunky progress chat where supported

  delay-after-world-create-seconds: 10   # seconds to wait after world creation before starting Chunky

# -----------------------------------------------------------------------------
# Messages
# -----------------------------------------------------------------------------

messages-prefix: '§5[§dCPVPSB§5] §d'
