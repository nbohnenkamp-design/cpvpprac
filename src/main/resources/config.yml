# CPVPSingleBiome Configuration
# Supported biomes:
# desert, plains, badlands, snow, mushroom, end

default-biome: plains                    # used if no biome is specified

# -----------------------------------------------------------------------------
# Terrain generation
# -----------------------------------------------------------------------------

base-height: 70                          # average terrain height

height-variation: 10                     # 0 = flat | 10 = recommended | 16 = strong hills

noise-scale: 80.0                        # 40 = bumpy | 80 = smooth | 160 = huge swells

flatness: 0.35                           # 0.0 = full hills | 0.35 = recommended | 1.0 = flat

# -----------------------------------------------------------------------------
# Decorations
# -----------------------------------------------------------------------------
# Sparse cinematic decoration designed for Crystal PvP readability.

decoration:

  enabled: true                          # master switch

  density: 0.15                          # 0.10 sparse | 0.15 recommended | 0.30 busy

  tree-density: 0.4                      # 0.0 none | 0.4 PvP style | 1.0 dense

  small-trees: true                      # PLAINS bushes / SNOW spruce trees

  flowers: true                          # PLAINS grass + flowers

  rocks: true                            # DESERT rocks / BADLANDS formations / END bumps

  dead-bushes: true                      # DESERT + BADLANDS

  cactus: true                           # DESERT cactus generation

  mushrooms: true                        # MUSHROOM small + large mushrooms

  # ---------------------------------------------------------------------------
  # Biome-specific overrides
  # ---------------------------------------------------------------------------

  biomes:

    plains:
      density: 0.12                      # very clean PvP terrain
      tree-density: 0.20

    desert:
      density: 0.08                      # mostly open
      tree-density: 0.0

    badlands:
      density: 0.18                      # more dramatic formations
      tree-density: 0.0

    snow:
      density: 0.14                      # open snowy biome
      tree-density: 0.35

    mushroom:
      density: 0.22                      # mystical / atmospheric
      tree-density: 0.0

    end:
      density: 0.04                      # almost empty
      tree-density: 0.0

# -----------------------------------------------------------------------------
# Snow biome atmosphere
# -----------------------------------------------------------------------------
# Designed for open Crystal PvP:
# light snow ambience, thin snow layers, larger but controlled packed-ice areas,
# sparse rock details and very few small/medium spruce trees.
#
# No powder snow.
# No ice-spike fields.
# No dense structures.
# No mixed blue-ice color noise.
#
# Generated ice areas use PACKED_ICE only:
# - looks like real frozen ice
# - slightly slippery
# - visually calmer than mixed ICE / PACKED_ICE / BLUE_ICE
# - no dark blue-ice spots

snow-effects:

  snowflake-particles:
    enabled: true                        # true = light ambient snow particles in snow worlds
    interval-ticks: 20                   # 20 ticks = once per second
    particles-per-player: 5              # low value to avoid visual spam
    radius: 10                           # horizontal particle spread around players
    height: 4                            # vertical particle spread above players

  terrain:
    snow-layers: true                    # place thin snow layers on suitable ground
    snow-layer-chance: 0.55              # 0.0 none | 0.55 light/medium | 1.0 everywhere
    max-snow-layer-height: 1             # 1 = thin snow only, good for PvP readability

  ice-details:
    enabled: true                        # small packed-ice accents and rare frozen ponds
    pond-chance: 0.02                    # rare frozen ponds, but visible enough
    small-ice-patch-chance: 0.005         # small local packed-ice areas
    max-pond-radius: 5                   # larger frozen ponds, still controlled for PvP
    max-ice-patch-radius: 3              # larger patches, but no huge skating fields

  rocks:
    enabled: true                        # small stone/ice orientation details
    chance: 0.01                         # sparse rocks
    max-size: 2                          # small details only, no big structures

  trees:
    enabled: true                        # allow rare small/medium snow spruce trees
    chance: 0.05                         # chance per chunk; rare, but actually visible

# -----------------------------------------------------------------------------
# World settings
# -----------------------------------------------------------------------------
# Minecraft worldborder size is a diameter, not a radius.
# 10000 means roughly X/Z -5000 to +5000 around the border center.

world-border-size: 10000                 # 0 = disabled | 10000 = X/Z -5000 to +5000

# -----------------------------------------------------------------------------
# Automatic world reset
# -----------------------------------------------------------------------------
# Only listed worlds are touched.
# last-reset-date is used to calculate the next automatic full reset.
# It is auto-written after /cpvpsb reset now or after a scheduled full reset.
# Single-world resets like /cpvpsb reset snow do not change last-reset-date.

reset:

  enabled: true                          # true = automatic scheduler active

  time: "05:00"                          # HH:mm format

  timezone: "Europe/Berlin"              # Germany, includes summer/winter time

  interval-days: 5                       # 1 daily | 7 weekly | 30 monthly-ish

  last-reset-date: "2026-06-06"          # YYYY-MM-DD | auto-written after full reset; empty = no full reset recorded yet

  world-settings:
    difficulty: HARD                     # PEACEFUL / EASY / NORMAL / HARD
    gamemode: SURVIVAL                   # SURVIVAL / CREATIVE / ADVENTURE / SPECTATOR
    pvp: true                            # true = PvP enabled after reset

  fallback-world: "newspawn"             # players are teleported here before reset

  skip-if-any-player-online: true        # postpone automatic reset while normal players are online

  retry-after-minutes: 10                # check again after this many minutes if reset was postponed

  block-joins-during-reset: true         # block normal players during world delete/create phase

  block-joins-during-chunky: false       # false = normal players may join while Chunky is running

  maintenance-bypass-permission: "cpvpsinglebiome.maintenance.bypass"

  maintenance-kick-message: "§c[CPVPSingleBiome] §fArenas are resetting. Please reconnect shortly."

  warning-enabled: true                  # broadcast countdown warnings if reset is allowed to run with players online

  warning-minutes: [10, 5, 1]            # countdown warnings before reset

  backup-old-worlds: false               # false = delete old world folders directly

  delete-old-worlds-after-success: true  # only relevant if backup-old-worlds is true

  maintenance-during-reset: false        # run external maintenance commands during reset

  maintenance-command-on: "main on"      # console command before reset

  maintenance-command-off: "main off"    # console command after reset

  worlds:
    - { world: "plains",   biome: "plains" }
    - { world: "desert",   biome: "desert" }
    - { world: "badlands", biome: "badlands" }
    - { world: "snow",     biome: "snow" }
    - { world: "mushroom", biome: "mushroom" }

# -----------------------------------------------------------------------------
# Chunky integration
# -----------------------------------------------------------------------------

chunky:

  enabled: true                          # automatically run after reset

  radius: 5000                           # pregeneration radius

  shape: "circle"                        # circle / square

  center-spawn: true                     # true = world spawn | false = 0/0

  silent: false                          # suppress Chunky progress chat

  delay-after-world-create-seconds: 10   # wait after world creation

# -----------------------------------------------------------------------------
# Messages
# -----------------------------------------------------------------------------

messages-prefix: '§5[§dCPVPSB§5] §d'
