name: CPVPSingleBiome
version: ${project.version}
main: me.liass.cpvpsinglebiome.CPVPSingleBiomePlugin
api-version: '1.21'

load: STARTUP

description: A Single-Biome World Generator Plugin for Crystal PvP servers
authors: [ CPVPPRAC ]

softdepend: [ Multiverse-Core, Chunky ]

commands:
  cpvpsb:
    description: Main command for CPVPSingleBiome
    usage: /<command> <help|version|about|status|export|reload|biomes|info|create|tp|reset|chunky>
    aliases: [ singlebiome, cpvpsinglebiome ]

permissions:
  cpvpsinglebiome.admin:
    description: Access to all CPVPSingleBiome admin commands
    default: op
    children:
      cpvpsinglebiome.version: true
      cpvpsinglebiome.about: true
      cpvpsinglebiome.status: true
      cpvpsinglebiome.export: true
      cpvpsinglebiome.reload: true
      cpvpsinglebiome.create: true
      cpvpsinglebiome.tp: true
      cpvpsinglebiome.info: true
      cpvpsinglebiome.reset: true
      cpvpsinglebiome.reset.now: true
      cpvpsinglebiome.chunky: true
      cpvpsinglebiome.maintenance.bypass: true

  cpvpsinglebiome.version:
    description: Allows use of /cpvpsb version
    default: true

  cpvpsinglebiome.about:
    description: Allows use of /cpvpsb about
    default: true

  cpvpsinglebiome.status:
    description: Allows use of /cpvpsb status
    default: op

  cpvpsinglebiome.export:
    description: Allows use of /cpvpsb export
    default: op

  cpvpsinglebiome.reload:
    description: Allows use of /cpvpsb reload
    default: op

  cpvpsinglebiome.create:
    description: Allows use of /cpvpsb create
    default: op

  cpvpsinglebiome.tp:
    description: Allows use of /cpvpsb tp
    default: op

  cpvpsinglebiome.info:
    description: Allows use of /cpvpsb info and /cpvpsb biomes
    default: true

  cpvpsinglebiome.reset:
    description: View reset status and reload reset configuration
    default: op

  cpvpsinglebiome.reset.now:
    description: Trigger a reset of one or all configured arenas
    default: op

  cpvpsinglebiome.chunky:
    description: Manually start Chunky pre-generation via /cpvpsb chunky
    default: op

  cpvpsinglebiome.maintenance.bypass:
    description: Allows joining during CPVPSingleBiome reset maintenance
    default: op
