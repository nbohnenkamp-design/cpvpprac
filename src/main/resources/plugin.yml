name: CPVPPracticeBot
version: '${project.version}'
main: eu.cpvpprac.practicebot.CPVPPracticeBotPlugin
api-version: '1.21'
authors:
  - cpvpprac
website: https://cpvpprac.eu
description: Crystal PvP practice bot for cpvpprac.eu / cpvpprac.net

commands:
  bot:
    description: Practice bot commands
    usage: /<command> <spawn|remove|tp|bring|attack|follow|reload>
    permission: cpvppracticebot.use

permissions:
  cpvppracticebot.use:
    description: Allows spawning and controlling a personal practice bot
    default: op
  cpvppracticebot.reload:
    description: Allows reloading the plugin configuration
    default: op
