name: CPVPSingleBiome
version: '${project.version}'
main: com.cpvpprac.singlebio.CPVPSingleBiome
api-version: '1.21'
load: STARTUP
author: Norbert Bohnenkamp
website: https://cpvpprac.eu
description: Crystal-PvP focused single-biome terrain generator with reset and Chunky integration.
softdepend: [Chunky]
loadbefore: [Multiverse-Core]

world-generators:
  CPVPSingleBiome: com.cpvpprac.singlebio.CPVPSingleBiome

commands:
  cpvpsb:
    description: CPVPSingleBiome admin commands
    usage: /<command> reset <status|reload|now|<world>> | chunky <start <world>|start-all>
    permission: cpvpsb.admin

permissions:
  cpvpsb.admin:
    description: Admin access to CPVPSingleBiome
    default: op
